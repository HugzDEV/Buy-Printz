    <div id="root" class="loading"></div>

    <!-- CSS Loading Optimization Script -->
    <script>
      // Mark as loaded when React app is ready
      window.addEventListener('load', function() {
        document.getElementById('root').classList.remove('loading');
        document.getElementById('root').classList.add('loaded');
      });
      
      // Fallback for slow loading
      setTimeout(function() {
        const root = document.getElementById('root');
        if (root.classList.contains('loading')) {
          root.classList.remove('loading');
          root.classList.add('loaded');
        }
      }, 3000);
      
      // Register Service Worker for caching optimization
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js')
            .then(function(registration) {
              console.log('Service Worker registered successfully:', registration.scope);
            })
            .catch(function(error) {
              console.log('Service Worker registration failed:', error);
            });
        });
      }
      
      // Optimize critical resource loading with error handling
      function optimizeResourceLoading() {
        // Vite handles main.jsx preloading automatically
        // Only add custom preloads for specific resources if needed
        console.log('Resource loading optimization complete');
      }
      
      // Run optimization immediately
      optimizeResourceLoading();
      
      // Font loading fallback with better detection
      function handleFontLoading() {
        // Wait for fonts to load or timeout
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(() => {
            // Check if Inter font is actually loaded
            if (!document.fonts.check('16px Inter')) {
              console.warn('Google Fonts failed to load, using system fonts');
              // Apply system font fallback
              document.documentElement.style.setProperty('--font-family', 'system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif');
            }
          }).catch(() => {
            console.warn('Font loading error, using system fonts');
            document.documentElement.style.setProperty('--font-family', 'system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif');
          });
        } else {
          // Fallback for browsers without Font Loading API
          setTimeout(() => {
            console.warn('Font loading API not available, using system fonts');
            document.documentElement.style.setProperty('--font-family', 'system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif');
          }, 5000);
        }
      }
      
      // Initialize font loading fallback
      handleFontLoading();
      
      // Image loading optimization
      function optimizeImageLoading() {
        // Add loaded class to lazy images when they load
        const lazyImages = document.querySelectorAll('img[loading="lazy"]');
        lazyImages.forEach(img => {
          img.addEventListener('load', function() {
            this.classList.add('loaded');
          });
        });
        
        // Preload critical images
        const criticalImages = [
          '/assets/images/buyprintz_logo.avif',
          '/assets/images/original_pics/buyprintz_logo.png'
        ];
        
        criticalImages.forEach(src => {
          const link = document.createElement('link');
          link.rel = 'preload';
          link.as = 'image';
          link.href = src;
          document.head.appendChild(link);
        });
      }
      
      // Initialize image optimization
      optimizeImageLoading();
      
      // Font loading optimization to prevent layout shifts
      function optimizeFontLoading() {
        // Add font-loading class initially
        document.documentElement.classList.add('font-loading');
        
        // Check if fonts are loaded
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(function() {
            document.documentElement.classList.remove('font-loading');
            document.documentElement.classList.add('fonts-loaded');
          });
        } else {
          // Fallback for browsers without Font Loading API
          setTimeout(function() {
            document.documentElement.classList.remove('font-loading');
            document.documentElement.classList.add('fonts-loaded');
          }, 3000);
        }
      }
      
      // Initialize font loading optimization
      optimizeFontLoading();
      
      // LCP optimization
      function optimizeLCP() {
        // Mark LCP element as critical
        const lcpElement = document.querySelector('.hero-title');
        if (lcpElement) {
          lcpElement.style.willChange = 'auto';
          lcpElement.style.contain = 'layout style';
        }
        
        // Preload hero section resources
        const heroSection = document.querySelector('.hero-section');
        if (heroSection) {
          heroSection.style.contain = 'layout style';
        }
        
        // Optimize font loading for LCP
        if (document.fonts && document.fonts.load) {
          document.fonts.load('700 3rem Inter').then(function() {
            console.log('LCP font loaded');
          });
        }
      }
      
      // Initialize LCP optimization
      optimizeLCP();
      
      // Conditional 3rd party loading optimization
      function optimizeThirdPartyLoading() {
        // Only preconnect to Stripe when payment is needed
        const preconnectStripe = () => {
          const link = document.createElement('link');
          link.rel = 'preconnect';
          link.href = 'https://js.stripe.com';
          document.head.appendChild(link);
          
          const link2 = document.createElement('link');
          link2.rel = 'preconnect';
          link2.href = 'https://m.stripe.network';
          document.head.appendChild(link2);
        };
        
        // Preconnect to Stripe when user navigates to checkout/payment pages
        const paymentRoutes = ['/checkout', '/tin-checkout', '/tent-checkout', '/tin-skinz-checkout'];
        const currentPath = window.location.pathname;
        
        if (paymentRoutes.some(route => currentPath.includes(route))) {
          preconnectStripe();
        }
        
        // Preconnect to Stripe on hover over payment buttons
        document.addEventListener('mouseover', function(e) {
          if (e.target.matches('button[type="submit"], .checkout-button, .payment-button')) {
            preconnectStripe();
            // Remove listener after first use
            document.removeEventListener('mouseover', arguments.callee);
          }
        });
      }
      
      // Initialize 3rd party optimization
      optimizeThirdPartyLoading();
      
      // Bundle optimization - preload critical chunks
      function optimizeBundleLoading() {
        // Preload critical route chunks on hover
        const criticalRoutes = [
          '/dashboard',
          '/editor',
          '/checkout'
        ];
        
        criticalRoutes.forEach(route => {
          const links = document.querySelectorAll(`a[href="${route}"]`);
          links.forEach(link => {
            link.addEventListener('mouseenter', function() {
              // Preload the route chunk
              const chunkName = route === '/dashboard' ? 'Dashboard' : 
                               route === '/editor' ? 'BannerEditor' : 
                               route === '/checkout' ? 'Checkout' : '';
              
              if (chunkName) {
                // This will be handled by React's lazy loading
                console.log(`Preloading ${chunkName} chunk`);
              }
            }, { once: true });
          });
        });
      }
      
      // Initialize bundle optimization
      optimizeBundleLoading();
    </script>
