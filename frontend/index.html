        {
          "@type": "Question",
          "name": "What types of banners do you print?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "We print three types of banners: 13oz Vinyl Banners (weather-resistant for outdoor use at $1.60/sqft), 8oz Mesh Banners (wind-resistant with 70% airflow at $1.80/sqft), and 18oz Blockout Banners (double-sided, premium quality at $2.50/sqft). All banners come with grommets and hemmed edges."
          }
        },
        {
          "@type": "Question",
          "name": "What makes your business card tins special?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Our business card tins are aluminum tins filled with mints and topped with a custom vinyl sticker featuring your design. They're reusable, memorable, and eco-friendly - making them far more effective than paper business cards. Minimum order of 100 units at $399.99."

        },

          "@type": "Question",
          "name": "What sticker shapes and options are available?",
